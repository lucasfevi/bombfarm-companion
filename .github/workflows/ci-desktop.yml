name: CI Desktop

# Path-filtered desktop quality + optional Windows smoke.
# Windows smoke runs on push to develop/main, workflow_dispatch, or PRs labeled `windows-ci`.

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    # Keep in sync with the dorny/paths-filter list in the changes job below.
    paths:
      - 'apps/desktop/**'
      - 'packages/contracts/**'
      - 'packages/domain/**'
      - 'packages/game-api/**'
      - 'packages/game-data/**'
      - 'packages/pricing/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - 'vitest.config.ts'
      - 'tools/**'
      - '.github/workflows/ci-desktop.yml'
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ci-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Keep in sync with on.push.paths above.
          filters: |
            desktop:
              - 'apps/desktop/**'
              - 'packages/contracts/**'
              - 'packages/domain/**'
              - 'packages/game-api/**'
              - 'packages/game-data/**'
              - 'packages/pricing/**'
              - 'packages/ui/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - 'vitest.config.ts'
              - 'tools/**'
              - '.github/workflows/ci-desktop.yml'

  quality:
    name: Typecheck, lint, unit (desktop path)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages (desktop deps)
        run: pnpm -r --filter @bombfarm/contracts --filter @bombfarm/ui --filter @bombfarm/game-data --filter @bombfarm/game-api --filter @bombfarm/pricing --filter @bombfarm/domain build

      - name: Typecheck desktop + deps
        run: >
          pnpm --filter @bombfarm/contracts --filter @bombfarm/ui
          --filter @bombfarm/game-data --filter @bombfarm/game-api --filter @bombfarm/pricing
          --filter @bombfarm/domain --filter @bombfarm/desktop typecheck

      - name: Lint desktop + deps
        run: >
          pnpm --filter @bombfarm/contracts --filter @bombfarm/ui
          --filter @bombfarm/game-data --filter @bombfarm/game-api --filter @bombfarm/pricing
          --filter @bombfarm/domain --filter @bombfarm/desktop lint

      # Root vitest minus the web project. apps/web's bundle assertions require
      # `pnpm --filter @bombfarm/web build` to have run first and now fail loudly rather
      # than skipping when it hasn't (apps/web/src/tests/support/build-output.ts) — and this
      # job deliberately never builds the web app. ci-web.yml owns those tests and runs them
      # after its own build step. Excluding one project rather than filtering by package
      # keeps everything else running here, including apps/desktop's own tests and tools/'s
      # CI-gate tests, neither of which has a package `test` script to be filtered by.
      - name: Unit tests (root vitest, excluding the web project)
        run: pnpm vitest run --project '!@bombfarm/web'

  smoke-windows:
    name: App boot smoke (Windows)
    runs-on: windows-latest
    needs: quality
    if: >
      needs.quality.result == 'success' &&
      (
        github.event_name != 'pull_request' ||
        contains(join(github.event.pull_request.labels.*.name, ','), 'windows-ci')
      )
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages and desktop shell
        run: pnpm --filter @bombfarm/desktop build
        env:
          NODE_ENV: production
          BFC_FLAVOR: dev

      - name: Install Playwright
        run: pnpm --filter @bombfarm/desktop exec playwright install

      - name: App boot smoke test
        run: pnpm --filter @bombfarm/desktop exec playwright test -c playwright.config.ts
        env:
          NODE_ENV: production
          BFC_FLAVOR: dev

  ci-desktop-required:
    name: ci-desktop-required
    needs: [changes, quality, smoke-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require path detection
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Require desktop quality
        if: needs.quality.result == 'failure' || needs.quality.result == 'cancelled'
        run: exit 1

      - name: Require Windows smoke when it ran
        if: needs.smoke-windows.result == 'failure' || needs.smoke-windows.result == 'cancelled'
        run: exit 1
