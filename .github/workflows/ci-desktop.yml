name: CI Desktop

# Path-filtered desktop quality + Windows smoke; package on main push.
# Paths documented for CIV-02 / CIV-03 (see plan mp1-ci-vercel-rebrand design).

on:
  push:
    branches: [main, develop]
    # Keep in sync with the dorny/paths-filter list in the changes job below.
    paths:
      - 'apps/desktop/**'
      - 'packages/contracts/**'
      - 'packages/game-data/**'
      - 'packages/pricing/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - 'vitest.config.ts'
      - 'tools/**'
      - '.github/workflows/ci-desktop.yml'
  pull_request:

concurrency:
  group: ci-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Keep in sync with on.push.paths above.
          filters: |
            desktop:
              - 'apps/desktop/**'
              - 'packages/contracts/**'
              - 'packages/game-data/**'
              - 'packages/pricing/**'
              - 'packages/ui/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - 'vitest.config.ts'
              - 'tools/**'
              - '.github/workflows/ci-desktop.yml'

  quality:
    name: Typecheck, lint, unit (desktop path)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages (desktop deps)
        run: pnpm -r --filter @bombfarm/contracts --filter @bombfarm/ui --filter @bombfarm/game-data --filter @bombfarm/pricing build

      - name: Typecheck desktop + deps
        run: >
          pnpm --filter @bombfarm/contracts --filter @bombfarm/ui
          --filter @bombfarm/game-data --filter @bombfarm/pricing
          --filter @bombfarm/desktop typecheck

      - name: Lint desktop + deps
        run: >
          pnpm --filter @bombfarm/contracts --filter @bombfarm/ui
          --filter @bombfarm/game-data --filter @bombfarm/pricing
          --filter @bombfarm/desktop lint

      - name: Unit tests (root vitest — packages touched by desktop)
        run: pnpm test

  smoke-windows:
    name: App boot smoke (Windows)
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages and desktop shell
        run: pnpm --filter @bombfarm/desktop build
        env:
          NODE_ENV: production
          BFC_FLAVOR: dev

      - name: Install Playwright
        run: pnpm --filter @bombfarm/desktop exec playwright install

      - name: App boot smoke test
        run: pnpm --filter @bombfarm/desktop exec playwright test -c playwright.config.ts
        env:
          NODE_ENV: production
          BFC_FLAVOR: dev

  package-windows:
    name: Package DEV and PROD (Windows)
    runs-on: windows-latest
    needs: smoke-windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package DEV flavor
        run: pnpm --filter @bombfarm/desktop package:dev
        env:
          NODE_ENV: production
          BFC_FLAVOR: dev

      - name: Package PROD flavor
        run: pnpm --filter @bombfarm/desktop package:prod
        env:
          NODE_ENV: production
          BFC_FLAVOR: prod

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: apps/desktop/release/**/*

  ci-desktop-required:
    name: ci-desktop-required
    needs: [changes, quality, smoke-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require path detection
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Require desktop quality
        if: needs.quality.result == 'failure' || needs.quality.result == 'cancelled'
        run: exit 1

      - name: Require Windows smoke
        if: needs.smoke-windows.result == 'failure' || needs.smoke-windows.result == 'cancelled'
        run: exit 1
