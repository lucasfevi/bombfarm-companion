name: Playwright e2e (web)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'packages/domain/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/e2e-web.yml'

concurrency:
  group: e2e-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  SHARD_TOTAL: 2

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect e2e-relevant paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            e2e:
              - 'apps/web/src/**'
              - 'apps/web/e2e/**'
              - 'apps/web/public/**'
              - 'apps/web/playwright.config.ts'
              - 'apps/web/next.config.ts'
              - 'apps/web/package.json'
              - 'packages/domain/**'
              - 'packages/ui/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/e2e-web.yml'

  build-e2e:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm --filter @bombfarm/web build:e2e

      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: e2e-static-out
          path: apps/web/out/
          retention-days: 1

  smoke-shard:
    needs: [changes, build-e2e]
    if: github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    # Browsers and their OS packages are baked in. On a bare runner the apt half of
    # `playwright install --with-deps` is at the mercy of the Ubuntu mirrors: normally
    # ~25s, but it has taken 15min on a bad day. Tag must track `@playwright/test`.
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # A no-op while the image tag matches the lockfile; if they ever drift this
      # fetches the right build (seconds) instead of failing on a missing executable.
      # No `--with-deps` — the apt packages are the image's job.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Download static export
        uses: actions/download-artifact@v4
        with:
          name: e2e-static-out
          path: apps/web/out

      - name: Run smoke e2e (shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }})
        id: smoke-test
        env:
          CI: '1'
          E2E_PREBUILT: '1'
          PLAYWRIGHT_BLOB: '1'
        run: pnpm exec playwright test --project=smoke --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }}

      - name: Upload blob report
        if: always() && steps.smoke-test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: blob-smoke-${{ matrix.shard }}
          path: apps/web/blob-report/
          if-no-files-found: ignore
          retention-days: 1

      - name: Collect screenshot diffs
        if: always() && steps.smoke-test.outcome == 'failure'
        run: node e2e/scripts/collect-visual-diffs.mjs

      - name: Upload screenshot diffs
        if: always() && steps.smoke-test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: diffs-smoke-${{ matrix.shard }}
          path: apps/web/visual-diffs/
          if-no-files-found: ignore
          retention-days: 1

  visual-e2e:
    needs: [changes, build-e2e]
    if: >
      (github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true') &&
      (
        github.event_name != 'pull_request' ||
        contains(join(github.event.pull_request.labels.*.name, ','), 'visual-ci')
      )
    runs-on: ubuntu-latest
    # Same image as smoke-shard, same reason. When `visual.spec.ts` comes off
    # `describe.skip`, capture the baselines in here — the committed PNGs predate
    # the container and its font rendering differs, against `maxDiffPixelRatio: 0`.
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Download static export
        uses: actions/download-artifact@v4
        with:
          name: e2e-static-out
          path: apps/web/out

      - name: Run visual e2e
        id: visual-test
        env:
          CI: '1'
          E2E_PREBUILT: '1'
          PLAYWRIGHT_BLOB: '1'
        run: pnpm exec playwright test --project=chromium

      - name: Upload blob report
        if: always() && steps.visual-test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: blob-visual
          path: apps/web/blob-report/
          if-no-files-found: ignore
          retention-days: 1

      - name: Collect screenshot diffs
        if: always() && steps.visual-test.outcome == 'failure'
        run: node e2e/scripts/collect-visual-diffs.mjs

      - name: Upload screenshot diffs
        if: always() && steps.visual-test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: diffs-visual
          path: apps/web/visual-diffs/
          if-no-files-found: ignore
          retention-days: 1

  perf:
    name: perf-render-counts (advisory, non-blocking)
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    # Same image as smoke-shard/visual-e2e — pinned to match @playwright/test.
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 20
    # Advisory only: componentRenders is deterministic on a dedicated host, but this has
    # not yet been observed on a shared GitHub-hosted runner. Promote to a required check
    # once it has run clean across real PRs here, not before.
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Build perf-measurement bundle
        run: pnpm perf:build:profile

      - name: Capture render counts (prod-profile)
        env:
          CI: '1'
        run: pnpm perf:capture:profile

      - name: Compare against committed baseline
        run: pnpm perf:compare

  report:
    needs: [changes, build-e2e, smoke-shard, visual-e2e]
    if: >
      always() && needs.changes.outputs.e2e == 'true' &&
      (needs.smoke-shard.result == 'failure' || needs.visual-e2e.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      actions: write
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: apps/web/all-blob-reports
          merge-multiple: true

      - name: Download screenshot diffs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: diffs-*
          path: apps/web/visual-diffs
          merge-multiple: true

      - name: Check merge inputs
        id: inputs
        run: |
          mkdir -p visual-diffs all-blob-reports
          if [ -n "$(find all-blob-reports -name '*.zip' -print -quit)" ]; then
            echo "blobs=true" >> "$GITHUB_OUTPUT"
          else
            echo "blobs=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No blob reports found — the failure happened before any test ran."
          fi

      - name: Merge blob reports into one HTML report
        if: steps.inputs.outputs.blobs == 'true'
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged report (single artifact)
        if: steps.inputs.outputs.blobs == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report/
            apps/web/visual-diffs/
          if-no-files-found: warn
          retention-days: 14

      - name: Delete intermediate shard artifacts
        continue-on-error: true
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          ids=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" --paginate \
            --jq '.artifacts[] | select(.name | startswith("blob-") or startswith("diffs-")) | .id')
          for id in $ids; do
            gh api -X DELETE "repos/${REPO}/actions/artifacts/${id}" && echo "deleted artifact ${id}"
          done

      - name: Build review summary and PR comment
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SMOKE_RESULT: ${{ needs.smoke-shard.result }}
          VISUAL_RESULT: ${{ needs.visual-e2e.result }}
        run: node e2e/scripts/build-report-comment.mjs

      - name: Append review summary to job summary
        if: always()
        run: cat pr-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- e2e-visual-report -->';
            const body = `${marker}\n${fs.readFileSync('apps/web/pr-comment.md', 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const mine = comments.filter(
              (c) => c.user.type === 'Bot' && c.body?.includes(marker),
            );
            const [existing, ...duplicates] = mine;
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
            const stale = [
              ...duplicates,
              ...comments.filter(
                (c) =>
                  c.user.type === 'Bot' &&
                  !c.body?.includes(marker) &&
                  c.body?.startsWith('## Playwright visual diffs'),
              ),
            ];
            for (const c of stale) {
              await github.rest.issues.deleteComment({ owner, repo, comment_id: c.id });
            }

  report-resolved:
    needs: [changes, smoke-shard, visual-e2e]
    if: >
      always() && github.event_name == 'pull_request' &&
      needs.changes.outputs.e2e == 'true' &&
      needs.smoke-shard.result == 'success' && needs.visual-e2e.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Mark existing report comment resolved
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- e2e-visual-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body?.includes(marker),
            );
            if (!existing) return;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.updateComment({
              owner, repo, comment_id: existing.id,
              body: `${marker}\n## Playwright e2e — review\n\n✅ Smoke and visual both pass on the latest commit ([run](${runUrl})). No diffs to review.`,
            });

  e2e-smoke:
    name: e2e-smoke
    needs: [changes, build-e2e, smoke-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require path detection
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Skip — no e2e-relevant changes
        if: needs.changes.outputs.e2e != 'true'
        run: echo "No e2e-relevant file changes."

      - name: Require smoke suite
        if: needs.changes.outputs.e2e == 'true'
        run: |
          if [ "${{ needs.build-e2e.result }}" != "success" ]; then
            echo "build-e2e: ${{ needs.build-e2e.result }}"
            exit 1
          fi
          if [ "${{ needs.smoke-shard.result }}" != "success" ]; then
            echo "smoke-shard: ${{ needs.smoke-shard.result }}"
            exit 1
          fi

  e2e-visual:
    name: e2e-visual
    needs: [changes, build-e2e, visual-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require path detection
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Skip — no e2e-relevant changes
        if: needs.changes.outputs.e2e != 'true'
        run: echo "No e2e-relevant file changes."

      - name: Skip — visual gated on PRs without visual-ci
        if: needs.visual-e2e.result == 'skipped'
        run: echo "Visual e2e skipped (runs on develop/main, or add label visual-ci)."

      - name: Require visual suite when it ran
        if: needs.visual-e2e.result == 'failure' || needs.visual-e2e.result == 'cancelled'
        run: |
          if [ "${{ needs.build-e2e.result }}" != "success" ]; then
            echo "build-e2e: ${{ needs.build-e2e.result }}"
            exit 1
          fi
          echo "visual-e2e: ${{ needs.visual-e2e.result }}"
          exit 1

      - name: Require visual suite success
        if: needs.visual-e2e.result == 'success'
        run: |
          if [ "${{ needs.build-e2e.result }}" != "success" ]; then
            echo "build-e2e: ${{ needs.build-e2e.result }}"
            exit 1
          fi
          echo "visual-e2e passed."
