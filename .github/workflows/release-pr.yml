name: Release PR

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish a GitHub prerelease for the beta installer
        required: false
        default: false
        type: boolean

concurrency:
  group: release-pr
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: write
  actions: write

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      proceed: ${{ steps.blocked.outputs.proceed || steps.plan.outputs.proceed || 'false' }}
      parity: ${{ steps.parity.outputs.state }}
      is_empty: ${{ steps.plan.outputs.is_empty }}
      has_desktop: ${{ steps.plan.outputs.has_desktop }}
      has_web: ${{ steps.plan.outputs.has_web }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate changeset files
        run: node tools/release/changeset-validation.mjs

      - name: Fetch main for parity
        run: git fetch origin main

      - name: Assess develop/main parity
        id: parity
        run: |
          git worktree add ../main-tree origin/main
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { assessParity, readWorkspaceVersions } from './tools/release/version-diff.mjs';

          const state = assessParity(
            readWorkspaceVersions('../main-tree'),
            readWorkspaceVersions('.'),
          );
          writeFileSync('parity-state.txt', state);
          NODE
          echo "state=$(cat parity-state.txt)" >> "$GITHUB_OUTPUT"

      - name: Remove main worktree
        if: always()
        run: git worktree remove ../main-tree --force

      - name: Stop when develop is behind main
        if: steps.parity.outputs.state == 'develop-behind'
        id: blocked
        run: |
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          {
            echo '## Release PR — waiting on version sync'
            echo ''
            echo '`develop` is behind `main` on at least one workspace package version.'
            echo 'Merge the open \`release/next\` → \`develop\` sync PR before the release rail runs again.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build release plan
        id: plan
        if: steps.parity.outputs.state != 'develop-behind'
        run: |
          pnpm changeset status --output=release-plan.json
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import {
            isEmptyReleaseSet,
            readReleaseSet,
            resolveArtifactPlan,
            selectRequiredWorkflows,
          } from './tools/release/release-plan.mjs';

          const plan = JSON.parse(readFileSync('release-plan.json', 'utf8'));
          const set = readReleaseSet(plan);
          const metadata = {
            set,
            artifactPlan: resolveArtifactPlan(set),
            workflows: selectRequiredWorkflows(set),
            isEmpty: isEmptyReleaseSet(set),
          };
          writeFileSync('release-metadata.json', JSON.stringify(metadata));
          NODE

          is_empty=$(node -p "JSON.parse(require('node:fs').readFileSync('release-metadata.json','utf8')).isEmpty")
          has_desktop=$(node -p "JSON.parse(require('node:fs').readFileSync('release-metadata.json','utf8')).set.hasDesktop")
          has_web=$(node -p "JSON.parse(require('node:fs').readFileSync('release-metadata.json','utf8')).set.hasWeb")

          {
            echo "proceed=true"
            echo "is_empty=${is_empty}"
            echo "has_desktop=${has_desktop}"
            echo "has_web=${has_web}"
          } >> "$GITHUB_OUTPUT"

      - name: Record empty release set
        if: steps.parity.outputs.state != 'develop-behind' && steps.plan.outputs.is_empty == 'true'
        run: |
          {
            echo '## Release PR — no pending changesets'
            echo ''
            echo 'No packages are scheduled to release. No release PR was created or updated.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release metadata
        if: steps.parity.outputs.state != 'develop-behind'
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            release-plan.json
            release-metadata.json
          retention-days: 1

  version-and-pr:
    name: Version and upsert PR
    needs: plan
    if: needs.plan.outputs.proceed == 'true' && needs.plan.outputs.is_empty == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      head_sha: ${{ steps.push.outputs.head_sha }}
      pr_number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Version packages on release/next
        run: |
          git switch -C release/next
          pnpm changeset version
          git add -A
          git diff --staged --quiet || git commit -m "chore(release): version packages"

      - name: Force-push release/next
        id: push
        run: |
          git push --force origin release/next
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Render release PR body
        env:
          HEAD_SHA: ${{ steps.push.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { renderReleaseReport } from './tools/release/release-report.mjs';

          const metadata = JSON.parse(readFileSync('release-metadata.json', 'utf8'));
          const body = renderReleaseReport({
            set: metadata.set,
            artifactPlan: metadata.artifactPlan,
            headSha: process.env.HEAD_SHA,
            runUrl: process.env.RUN_URL,
            prodReleaseEnabled: false,
          });
          writeFileSync('release-pr-body.md', body);
          NODE

      - name: Upsert release PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh pr list --head release/next --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "chore(release): develop → main" --body-file release-pr-body.md
            echo "number=${existing}" >> "$GITHUB_OUTPUT"
          else
            gh pr create \
              --head release/next \
              --base main \
              --title "chore(release): develop → main" \
              --body-file release-pr-body.md
            number=$(gh pr list --head release/next --base main --state open --json number --jq '.[0].number')
            echo "number=${number}" >> "$GITHUB_OUTPUT"
          fi

  dispatch-required-ci:
    name: Dispatch required CI
    needs: [plan, version-and-pr]
    if: >-
      needs.plan.outputs.proceed == 'true' &&
      needs.plan.outputs.is_empty == 'false' &&
      needs.version-and-pr.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata

      - name: Dispatch path-filtered CI workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflows=$(node -p "JSON.parse(require('node:fs').readFileSync('release-metadata.json','utf8')).workflows.join(' ')")
          for workflow in $workflows; do
            echo "Dispatching ${workflow} on release/next"
            gh workflow run "$workflow" --ref release/next
          done

  beta-installer:
    name: Beta installer
    needs: [plan, version-and-pr]
    if: >-
      needs.plan.outputs.proceed == 'true' &&
      needs.plan.outputs.is_empty == 'false' &&
      needs.plan.outputs.has_desktop == 'true' &&
      needs.version-and-pr.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release/next
        uses: actions/checkout@v4
        with:
          ref: release/next

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package beta installer
        run: pnpm --filter @bombfarm/desktop package:beta
        env:
          NODE_ENV: production
          BFC_FLAVOR: beta

      - name: List beta release output
        id: list
        shell: bash
        working-directory: apps/desktop
        run: |
          {
            echo '## Beta release output (`release/beta/`)'
            echo '```'
            ls -la release/beta/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f release/beta/beta.yml ]; then
            echo "beta_yml_present=true" >> "$GITHUB_OUTPUT"
            echo "beta.yml is present under --publish never."
          else
            echo "beta_yml_present=false" >> "$GITHUB_OUTPUT"
            echo "::error::beta.yml is missing from release/beta/ under --publish never"
            exit 1
          fi

      - name: Resolve artifact naming
        id: meta
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          sha7=${HEAD_SHA:0:7}
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=bombfarm-companion-beta-${version}-${sha7}" >> "$GITHUB_OUTPUT"
        env:
          HEAD_SHA: ${{ needs.version-and-pr.outputs.head_sha }}

      - name: Upload beta installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: apps/desktop/release/beta/**

      - name: Upsert beta installer PR comment
        if: success()
        uses: actions/github-script@v7
        env:
          ARTIFACT_NAME: ${{ steps.meta.outputs.artifact_name }}
          DESKTOP_VERSION: ${{ steps.meta.outputs.version }}
          HEAD_SHA: ${{ needs.version-and-pr.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ needs.version-and-pr.outputs.pr_number }}
        with:
          script: |
            const marker = '<!-- bfc-beta-installer -->';
            const headSha = process.env.HEAD_SHA ?? '';
            const body = [
              marker,
              '',
              '## Beta installer',
              '',
              `- Artifact: \`${process.env.ARTIFACT_NAME}\``,
              `- Desktop version: \`${process.env.DESKTOP_VERSION}\``,
              `- Head SHA: \`${headSha}\` (\`${headSha.slice(0, 7)}\`)`,
              `- Workflow run: ${process.env.RUN_URL}`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Publish beta-installer check run (success)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.version-and-pr.outputs.head_sha }}
        run: |
          gh api "repos/${{ github.repository }}/check-runs" \
            -f name=beta-installer \
            -f head_sha="$HEAD_SHA" \
            -f status=completed \
            -f conclusion=success \
            -f output[title]="Beta installer built" \
            -f output[summary]="Beta installer artifact uploaded for this release head."

      - name: Publish beta-installer check run (failure)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.version-and-pr.outputs.head_sha }}
        run: |
          gh api "repos/${{ github.repository }}/check-runs" \
            -f name=beta-installer \
            -f head_sha="$HEAD_SHA" \
            -f status=completed \
            -f conclusion=failure \
            -f output[title]="Beta installer failed" \
            -f output[summary]="Beta packaging failed. No artifact was uploaded."

      - name: Publish optional GitHub prerelease
        if: >-
          success() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.publish_prerelease == true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          tag="desktop-v${VERSION}-beta.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" apps/desktop/release/beta/* \
            --prerelease \
            --title "Desktop ${VERSION} beta (run ${GITHUB_RUN_NUMBER})"

  summary:
    name: Release summary
    needs: [plan, version-and-pr, dispatch-required-ci, beta-installer]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release metadata
        if: needs.plan.outputs.proceed == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release-metadata

      - name: Write job summary
        env:
          PARITY: ${{ needs.plan.outputs.parity }}
          PROCEED: ${{ needs.plan.outputs.proceed }}
          IS_EMPTY: ${{ needs.plan.outputs.is_empty }}
          HEAD_SHA: ${{ needs.version-and-pr.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$PARITY" = "develop-behind" ]; then
            exit 0
          fi

          if [ "$IS_EMPTY" = "true" ]; then
            exit 0
          fi

          if [ ! -f release-metadata.json ]; then
            echo "::warning::Release metadata artifact is missing."
            exit 0
          fi

          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { renderReleaseReport } from './tools/release/release-report.mjs';

          const metadata = JSON.parse(readFileSync('release-metadata.json', 'utf8'));
          const headSha = process.env.HEAD_SHA || 'unknown';
          const report = renderReleaseReport({
            set: metadata.set,
            artifactPlan: metadata.artifactPlan,
            headSha,
            runUrl: process.env.RUN_URL,
            prodReleaseEnabled: false,
          });
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${report}\n`);
          NODE
