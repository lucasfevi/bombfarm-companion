name: Release PR

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Force-republish the GitHub beta prerelease for this run
        required: false
        default: false
        type: boolean

concurrency:
  group: release-pr
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: write
  actions: write

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      proceed: ${{ steps.blocked.outputs.proceed || steps.plan.outputs.proceed || 'false' }}
      parity: ${{ steps.parity.outputs.state }}
      is_empty: ${{ steps.plan.outputs.is_empty }}
      has_desktop: ${{ steps.plan.outputs.has_desktop }}
      has_web: ${{ steps.plan.outputs.has_web }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate changeset files
        run: node tools/release/changeset-validation.mjs

      - name: Fetch main for parity
        run: git fetch origin main

      - name: Assess develop/main parity
        id: parity
        run: |
          git worktree add ../main-tree origin/main
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { assessParity, readWorkspaceVersions } from './tools/release/version-diff.mjs';

          const state = assessParity(
            readWorkspaceVersions('../main-tree'),
            readWorkspaceVersions('.'),
          );
          writeFileSync('parity-state.txt', state);
          NODE
          echo "state=$(cat parity-state.txt)" >> "$GITHUB_OUTPUT"

      - name: Remove main worktree
        if: always()
        run: git worktree remove ../main-tree --force

      - name: Stop when develop is behind main
        if: steps.parity.outputs.state == 'develop-behind'
        id: blocked
        run: |
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          {
            echo '## Release PR — waiting on version sync'
            echo ''
            echo '`develop` is behind `main` on at least one workspace package version.'
            echo 'Merge the open \`release/next\` → \`develop\` sync PR before the release rail runs again.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build release plan
        id: plan
        if: steps.parity.outputs.state != 'develop-behind'
        run: |
          pnpm changeset status --output=release-plan.json
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import {
            isEmptyReleaseSet,
            readReleaseSet,
            resolveArtifactPlan,
            selectRequiredWorkflows,
          } from './tools/release/release-plan.mjs';

          const plan = JSON.parse(readFileSync('release-plan.json', 'utf8'));
          const set = readReleaseSet(plan);
          const metadata = {
            set,
            artifactPlan: resolveArtifactPlan(set),
            workflows: selectRequiredWorkflows(set),
            isEmpty: isEmptyReleaseSet(set),
          };
          writeFileSync('release-metadata.json', JSON.stringify(metadata));
          NODE

          is_empty=$(node -p "JSON.parse(require('node:fs').readFileSync('release-metadata.json','utf8')).isEmpty")
          has_desktop=$(node -p "JSON.parse(require('node:fs').readFileSync('release-metadata.json','utf8')).set.hasDesktop")
          has_web=$(node -p "JSON.parse(require('node:fs').readFileSync('release-metadata.json','utf8')).set.hasWeb")

          {
            echo "proceed=true"
            echo "is_empty=${is_empty}"
            echo "has_desktop=${has_desktop}"
            echo "has_web=${has_web}"
          } >> "$GITHUB_OUTPUT"

      - name: Record empty release set
        if: steps.parity.outputs.state != 'develop-behind' && steps.plan.outputs.is_empty == 'true'
        run: |
          {
            echo '## Release PR — no pending changesets'
            echo ''
            echo 'No packages are scheduled to release. Any open release PR will be closed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release metadata
        if: steps.parity.outputs.state != 'develop-behind'
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            release-plan.json
            release-metadata.json
          retention-days: 1

  close-empty:
    name: Close stale release PR
    needs: plan
    if: needs.plan.outputs.proceed == 'true' && needs.plan.outputs.is_empty == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Close open release/next → main PR
        id: close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh pr list --head release/next --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr comment "$existing" --body "Closing: no pending changesets remain on \`develop\`. The release rail will open a new PR when changesets are added again."
            gh pr close "$existing"
            echo "closed_pr=${existing}" >> "$GITHUB_OUTPUT"
          else
            echo "closed_pr=" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete remote release/next when safe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --heads origin release/next | grep -q release/next; then
            git push origin --delete release/next || true
          fi

      - name: Confirm no release PR remains open
        env:
          GH_TOKEN: ${{ github.token }}
          CLOSED_PR: ${{ steps.close.outputs.closed_pr }}
        run: |
          remaining=$(gh pr list --head release/next --base main --state open --json number --jq 'length')
          if [ "$remaining" != "0" ]; then
            echo "::error::An open release/next → main PR still exists after cleanup"
            exit 1
          fi

          {
            echo '## Release PR — empty set cleanup'
            echo ''
            if [ -n "$CLOSED_PR" ]; then
              echo "Closed stale release PR #${CLOSED_PR}."
            else
              echo 'No open release PR was found.'
            fi
            echo ''
            echo 'No release PR remains open for \`release/next\` → \`main\`.'
          } >> "$GITHUB_STEP_SUMMARY"

  version-and-pr:
    name: Version and upsert PR
    needs: plan
    if: needs.plan.outputs.proceed == 'true' && needs.plan.outputs.is_empty == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      head_sha: ${{ steps.push.outputs.head_sha }}
      pr_number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          # PAT so commits/PR updates trigger pull_request checks (GITHUB_TOKEN does not).
          token: ${{ secrets.RELEASE_PAT }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          # Outside the workspace: unpacking into the repo root would leave
          # release-plan.json / release-metadata.json for the commit below to sweep up.
          path: ${{ runner.temp }}/release-metadata

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Reconcile main's squashed release history
        env:
          # Bot commits must not run local husky/commitlint (COMMIT_EDITMSG path + no TTY).
          HUSKY: '0'
          MAIN_ONLY_LOG: ${{ runner.temp }}/main-only-commits.tsv
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git switch -C release/next

          # main must be an ancestor of the release head, or the release PR's merge base
          # falls back to develop's tip at the previous release and both sides show a
          # conflicting bump of the same `version` lines and CHANGELOG sections.
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "main is already an ancestor of release/next; nothing to reconcile."
            exit 0
          fi

          # -s ours keeps develop's tree and discards main's, so refuse when main holds
          # anything the rail did not put there (a hotfix landed straight on main).
          git log --format='%H%x09%s' origin/main ^HEAD > "$MAIN_ONLY_LOG"
          node tools/release/main-reconcile.mjs "$MAIN_ONLY_LOG"

          git merge -s ours origin/main \
            -m "chore(release): reconcile main's squashed release history"

      - name: Version packages on release/next
        env:
          # Bot commits must not run local husky/commitlint (COMMIT_EDITMSG path + no TTY).
          HUSKY: '0'
        run: |
          set -euo pipefail
          pnpm changeset version
          # Stage only what `changeset version` is allowed to touch — consumed changesets,
          # version bumps and CHANGELOGs. A bare `git add -A` also sweeps up untracked CI
          # scratch sitting in the repo root and rides it to main on merge.
          git add -A -- .changeset apps packages pnpm-lock.yaml

          stray=$(git diff --staged --name-only \
            | grep -E '^(release-plan\.json|release-metadata\.json|release-pr-body\.md)$' || true)
          if [ -n "$stray" ]; then
            echo "::error::Release commit would contain CI scratch: ${stray}"
            exit 1
          fi

          git diff --staged --quiet || git commit -m "chore(release): version packages"

      - name: Force-push release/next
        id: push
        run: |
          git push --force origin release/next
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Render release PR body
        env:
          HEAD_SHA: ${{ steps.push.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          METADATA_PATH: ${{ runner.temp }}/release-metadata/release-metadata.json
          BODY_PATH: ${{ runner.temp }}/release-pr-body.md
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { renderReleaseReport } from './tools/release/release-report.mjs';

          const metadata = JSON.parse(readFileSync(process.env.METADATA_PATH, 'utf8'));
          const body = renderReleaseReport({
            set: metadata.set,
            artifactPlan: metadata.artifactPlan,
            headSha: process.env.HEAD_SHA,
            runUrl: process.env.RUN_URL,
          });
          writeFileSync(process.env.BODY_PATH, body);
          NODE

      - name: Upsert release PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          BODY_PATH: ${{ runner.temp }}/release-pr-body.md
        run: |
          existing=$(gh pr list --head release/next --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "chore(release): develop → main" --body-file "$BODY_PATH"
            echo "number=${existing}" >> "$GITHUB_OUTPUT"
          else
            gh pr create \
              --head release/next \
              --base main \
              --title "chore(release): develop → main" \
              --body-file "$BODY_PATH"
            number=$(gh pr list --head release/next --base main --state open --json number --jq '.[0].number')
            echo "number=${number}" >> "$GITHUB_OUTPUT"
          fi

  beta-installer:
    name: Beta installer
    needs: [plan, version-and-pr]
    if: >-
      needs.plan.outputs.proceed == 'true' &&
      needs.plan.outputs.is_empty == 'false' &&
      needs.plan.outputs.has_desktop == 'true' &&
      needs.version-and-pr.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release/next
        uses: actions/checkout@v4
        with:
          ref: release/next

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before packaging, not after: the version has to reach electron-builder as
      # BFC_VERSION_OVERRIDE so it lands in the installer and in beta.yml. Resolved from the
      # run number, so consecutive betas of one release compare as newer instead of all
      # shipping as the same bare package.json version.
      - name: Resolve beta version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version=$(node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { buildBetaVersion } from './tools/release/release-tag.mjs';
            const baseVersion = JSON.parse(readFileSync('apps/desktop/package.json', 'utf8')).version;
            process.stdout.write(buildBetaVersion({ baseVersion, runNumber: process.env.GITHUB_RUN_NUMBER }));
          ")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Package beta installer
        run: pnpm --filter @bombfarm/desktop package:beta
        env:
          NODE_ENV: production
          BFC_FLAVOR: beta
          BFC_VERSION_OVERRIDE: ${{ steps.meta.outputs.version }}

      - name: List beta release output
        id: list
        shell: bash
        working-directory: apps/desktop
        run: |
          {
            echo '## Beta release output (`release/beta/`)'
            echo '```'
            ls -la release/beta/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f release/beta/beta.yml ]; then
            echo "beta_yml_present=true" >> "$GITHUB_OUTPUT"
            echo "beta.yml is present under --publish never."
          else
            echo "beta_yml_present=false" >> "$GITHUB_OUTPUT"
            echo "::error::beta.yml is missing from release/beta/ under --publish never"
            exit 1
          fi

      - name: Publish GitHub beta prerelease
        id: publish
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          HEAD_SHA: ${{ needs.version-and-pr.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(node --input-type=module -e "
            import { buildDesktopTag } from './tools/release/release-tag.mjs';
            process.stdout.write(buildDesktopTag(process.env.VERSION));
          ")
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          cleanup_failed_release() {
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          }

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          fi

          gh release create "$tag" \
            --prerelease \
            --draft \
            --title "Desktop ${VERSION} beta (${HEAD_SHA:0:7})"

          trap cleanup_failed_release ERR

          for asset in apps/desktop/release/beta/*; do
            [ -f "$asset" ] || continue
            gh release upload "$tag" "$asset"
          done

          gh release edit "$tag" --draft=false
          trap - ERR

      - name: Upsert beta installer PR comment
        if: success()
        uses: actions/github-script@v7
        env:
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.publish.outputs.tag }}
          DESKTOP_VERSION: ${{ steps.meta.outputs.version }}
          HEAD_SHA: ${{ needs.version-and-pr.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ needs.version-and-pr.outputs.pr_number }}
        with:
          script: |
            const marker = '<!-- bfc-beta-installer -->';
            const headSha = process.env.HEAD_SHA ?? '';
            const body = [
              marker,
              '',
              '## Beta installer',
              '',
              `- Release: ${process.env.RELEASE_URL}`,
              `- Desktop version: \`${process.env.DESKTOP_VERSION}\``,
              `- Head SHA: \`${headSha}\` (\`${headSha.slice(0, 7)}\`)`,
              `- Workflow run: ${process.env.RUN_URL}`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Publish beta-installer check run (success)
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.version-and-pr.outputs.head_sha }}
        run: |
          gh api "repos/${{ github.repository }}/check-runs" \
            -f name=beta-installer \
            -f head_sha="$HEAD_SHA" \
            -f status=completed \
            -f conclusion=success \
            -f output[title]="Beta installer built" \
            -f output[summary]="Beta installer published to the beta prerelease for this release head."

      - name: Publish beta-installer check run (failure)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.version-and-pr.outputs.head_sha }}
        run: |
          gh api "repos/${{ github.repository }}/check-runs" \
            -f name=beta-installer \
            -f head_sha="$HEAD_SHA" \
            -f status=completed \
            -f conclusion=failure \
            -f output[title]="Beta installer failed" \
            -f output[summary]="Beta packaging or publish failed. No installer was published."

  summary:
    name: Release summary
    needs: [plan, version-and-pr, beta-installer]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release metadata
        if: needs.plan.outputs.proceed == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: ${{ runner.temp }}/release-metadata

      - name: Write job summary
        env:
          PARITY: ${{ needs.plan.outputs.parity }}
          PROCEED: ${{ needs.plan.outputs.proceed }}
          IS_EMPTY: ${{ needs.plan.outputs.is_empty }}
          HEAD_SHA: ${{ needs.version-and-pr.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          METADATA_PATH: ${{ runner.temp }}/release-metadata/release-metadata.json
        run: |
          if [ "$PARITY" = "develop-behind" ]; then
            exit 0
          fi

          if [ "$IS_EMPTY" = "true" ]; then
            exit 0
          fi

          if [ ! -f "$METADATA_PATH" ]; then
            echo "::warning::Release metadata artifact is missing."
            exit 0
          fi

          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { renderReleaseReport } from './tools/release/release-report.mjs';

          const metadata = JSON.parse(readFileSync(process.env.METADATA_PATH, 'utf8'));
          const headSha = process.env.HEAD_SHA || 'unknown';
          const report = renderReleaseReport({
            set: metadata.set,
            artifactPlan: metadata.artifactPlan,
            headSha,
            runUrl: process.env.RUN_URL,
          });
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${report}\n`);
          NODE
