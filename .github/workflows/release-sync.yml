name: Release sync

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: write
  actions: write

jobs:
  sync:
    name: Sync versions to develop
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'release/next'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Recreate release/next from merged PR head
        id: recreate
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # After merge with delete_branch_on_merge, the head SHA may be
          # unreachable via a plain `git fetch origin`. Prefer the retained
          # pull/<n>/head ref, then fall back to fetching the SHA directly.
          if ! git fetch --no-tags origin "pull/${PR_NUMBER}/head"; then
            git fetch --no-tags origin "${HEAD_SHA}"
          fi
          if ! git push --force origin "${HEAD_SHA}:refs/heads/release/next"; then
            {
              echo '::error::Failed to recreate release/next from merged PR head'
              echo '## Release sync — manual action required'
              echo ''
              echo 'Recreate the versioned branch, then open the sync PR:'
              echo ''
              echo '```bash'
              echo "git fetch origin pull/${PR_NUMBER}/head"
              echo "git push --force origin ${HEAD_SHA}:refs/heads/release/next"
              echo 'gh pr create --head release/next --base develop --title "chore(release): sync versions to develop"'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Open sync PR to develop
        id: open-pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          existing=$(gh pr list --head release/next --base develop --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "number=${existing}" >> "$GITHUB_OUTPUT"
          else
            if ! gh pr create \
              --head release/next \
              --base develop \
              --title "chore(release): sync versions to develop" \
              --body "Automated version sync after releasing \`release/next\` to \`main\`."; then
              {
                echo '::error::Failed to create sync PR release/next → develop'
                echo '## Release sync — manual action required'
                echo ''
                echo 'Create the sync PR manually:'
                echo ''
                echo '```bash'
                echo 'gh pr create --head release/next --base develop --title "chore(release): sync versions to develop"'
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            number=$(gh pr list --head release/next --base develop --state open --json number --jq '.[0].number')
            echo "number=${number}" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable auto-merge on sync PR
        id: merge
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          PR_NUMBER: ${{ steps.open-pr.outputs.number }}
        run: |
          set -uo pipefail

          # GitHub only accepts enablePullRequestAutoMerge while the PR is blocked by a
          # pending required check. Called right after creation the checks have not
          # registered yet, so it answers "Pull request is in unstable status". Retry
          # while they spin up.
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$PR_NUMBER" --auto --squash; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Attempt ${attempt}: auto-merge not accepted yet; waiting for required checks to register."
              sleep 20
            fi
          done

          # The sync PR itself exists and is correct — the whole point of this job. Losing
          # a convenience toggle must not report the sync as failed.
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Auto-merge could not be enabled for PR #${PR_NUMBER}; merge it manually once checks pass."
          {
            echo '## Release sync — merge the sync PR manually'
            echo ''
            echo "Auto-merge could not be enabled for PR #${PR_NUMBER} (it may already be"
            echo 'mergeable, or auto-merge is disabled for the repository). The sync PR was'
            echo 'created correctly. After required checks pass, run:'
            echo ''
            echo '```bash'
            echo "gh pr merge ${PR_NUMBER} --squash"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record successful sync kickoff
        if: success() && steps.merge.outputs.enabled == 'true'
        run: |
          {
            echo '## Release sync'
            echo ''
            echo "Sync PR #${{ steps.open-pr.outputs.number }} (\`release/next\` → \`develop\`) is queued."
            echo 'Normal pull_request CI should run on the sync head (RELEASE_PAT). Auto-merge (squash) was enabled.'
          } >> "$GITHUB_STEP_SUMMARY"
