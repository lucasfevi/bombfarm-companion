name: CI Web

# Path-filtered web quality including next build before Vercel deploy.

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    # Keep in sync with the dorny/paths-filter list in the changes job below.
    paths:
      - 'apps/web/**'
      - 'packages/account/**'
      - 'packages/contracts/**'
      - 'packages/domain/**'
      - 'packages/farm/**'
      - 'packages/game-art/**'
      - 'packages/hero/**'
      - 'packages/pricing/**'
      - 'packages/team-plan/**'
      - 'packages/ui/**'
      - 'docs/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - 'vitest.config.ts'
      - 'vitest.solver.config.ts'
      - 'vitest.solver-files.mjs'
      - 'vitest.coverage.ts'
      - 'vitest.workers.ts'
      - 'tools/domain-coverage*.mjs'
      - 'tools/cpu-budget.mjs'
      - 'tools/with-heavy-slot.mjs'
      - 'tools/shell-command.mjs'
      - '.github/workflows/ci-web.yml'
  pull_request:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      domain: ${{ steps.filter.outputs.domain }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Keep in sync with on.push.paths above.
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/account/**'
              - 'packages/contracts/**'
              - 'packages/domain/**'
              - 'packages/farm/**'
              - 'packages/game-art/**'
              - 'packages/hero/**'
              - 'packages/pricing/**'
              - 'packages/team-plan/**'
              - 'packages/ui/**'
              - 'docs/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - 'vitest.config.ts'
              - 'vitest.solver.config.ts'
              - 'vitest.solver-files.mjs'
              - '.github/workflows/ci-web.yml'
            domain:
              - 'packages/domain/**'
              - 'packages/contracts/**'
              - 'vitest.config.ts'
              - 'vitest.solver.config.ts'
              - 'vitest.solver-files.mjs'
              - 'vitest.coverage.ts'
              - 'vitest.workers.ts'
              - 'tools/domain-coverage*.mjs'
              - 'tools/cpu-budget.mjs'
              - 'tools/with-heavy-slot.mjs'
              - 'tools/shell-command.mjs'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'tsconfig.base.json'
              - '.github/workflows/ci-web.yml'

  quality:
    name: Typecheck, lint, build, unit (web)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # The domain suite runs in the `domain` jobs below, not here. This job takes ~7 minutes on a
    # slow runner; the cap is loose on purpose, so slow-runner variance cannot cancel a green run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # packages/domain resolves @bombfarm/contracts through node_modules -> dist/index.d.ts,
      # not a tsconfig `paths` mapping to source (that fails TS6059: domain's tsconfig sets
      # rootDir: "src", and a paths entry pointing outside it is rejected). So contracts must
      # be built before anything that typechecks domain source, same as ci-desktop.yml's
      # existing "Build workspace packages (desktop deps)" step.
      # `@bombfarm/pricing` is the one workspace package the planner consumes from `dist` rather
      # than from source: it carries `.js` import specifiers so its build stays importable by the
      # Node-side snapshot tool, which rules out the source alias the other packages use.
      - name: Build contracts and pricing (type dependencies)
        run: pnpm --filter @bombfarm/contracts --filter @bombfarm/pricing build

      # apps/web itself still resolves @bombfarm/domain SOURCE via tsconfig `paths` and the
      # Vitest `resolve.alias` — this step is NOT that. It exists because @bombfarm/farm and
      # @bombfarm/hero reach domain through its exports map (which points at dist), so the
      # typecheck and lint steps below cannot run before this. Do not "simplify" this into a
      # web dependency; web never reads packages/domain/dist.
      - name: Build domain (typecheck and lint reach it through dist)
        run: pnpm --filter @bombfarm/domain build

      - name: Typecheck web + domain + ui + game-art + farm + hero + team-plan
        run: >
          pnpm --filter @bombfarm/domain --filter @bombfarm/ui --filter @bombfarm/game-art
          --filter @bombfarm/farm --filter @bombfarm/hero --filter @bombfarm/team-plan
          --filter @bombfarm/web typecheck

      - name: Lint web + domain + ui + game-art + farm + hero + team-plan
        run: >
          pnpm --filter @bombfarm/domain --filter @bombfarm/ui --filter @bombfarm/game-art
          --filter @bombfarm/farm --filter @bombfarm/hero --filter @bombfarm/team-plan
          --filter @bombfarm/web lint

      # MUST stay before the web unit tests. Several web tests assert on real build output
      # in apps/web/out (team-plan-worker-bundle, devtools-not-in-production-bundle) — the
      # only byte-level proof that a chunk actually shipped. This step used to run AFTER
      # them, so out/ never existed and those assertions silently skipped on every CI run.
      # See apps/web/src/tests/support/build-output.ts; they now fail loudly instead.
      - name: Build web static export
        run: pnpm --filter @bombfarm/web build

      - name: Unit tests (web, asserts against the build above)
        run: pnpm --filter @bombfarm/web test

  # The domain suite is two Vitest passes (see vitest.solver.config.ts) and the heaviest thing in
  # CI, so each piece gets its own runner. Vitest splits shards by a hash of the file path and
  # balances by file count, not duration, so the shard count was chosen by summing per-file
  # times: more shards did not lower the slowest one, because the heaviest file is a floor.
  # tools/vitest-solver-split.test.mjs fails when these entries stop covering every shard or
  # the solver pass goes missing.
  domain:
    name: ${{ matrix.name }}
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # On a slow runner a shard takes ~8 minutes with setup and the solver pass ~11, ending on
    # its longest single test. The caps are loose on purpose.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit tests (domain, shard 1/2)
            timeout: 25
            build: true
            run: pnpm --filter @bombfarm/domain exec vitest run --shard=1/2
          - name: Unit tests (domain, shard 2/2)
            timeout: 25
            build: true
            run: pnpm --filter @bombfarm/domain exec vitest run --shard=2/2
          - name: Unit tests (domain, solver pass)
            timeout: 35
            build: false
            run: pnpm vitest run --config vitest.solver.config.ts
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only the domain project needs a build: its packaging test (dist-package-exports.test.ts)
      # asserts against packages/domain/dist, and building domain resolves @bombfarm/contracts
      # through its dist (see the quality job). The solver pass aliases both to source.
      - name: Build contracts and domain (the packaging test needs dist)
        if: matrix.build
        run: pnpm --filter @bombfarm/contracts --filter @bombfarm/domain build

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  # The coverage ratchet runs apart from the shards above: instrumented runs are several times
  # slower than plain ones, and the two Vitest passes (domain project and solver pass) have to be
  # merged so vitest itself can combine their raw V8 data into one per-file picture — coverage from
  # one pass alone would understate everything the solver suite reaches. Each pass measures in its
  # own matrix entry and uploads its blob and JSON results; the ratchet job below downloads both and
  # merges. The blobs carry absolute paths, which match because every runner checks out to the same
  # directory. The dedicated filter keeps pull requests that cannot move domain coverage from paying.
  domain-coverage-pass:
    name: Domain coverage pass (${{ matrix.pass }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.domain == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - pass: domain
            build: true
          # The solver pass aliases contracts and domain to source, so it needs no build.
          - pass: solver
            build: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts and domain (the packaging test needs dist)
        if: matrix.build
        run: pnpm --filter @bombfarm/contracts --filter @bombfarm/domain build

      - name: Measure the ${{ matrix.pass }} pass
        run: node tools/domain-coverage.mjs measure-${{ matrix.pass }}

      - name: Upload the pass's blob and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-coverage-pass-${{ matrix.pass }}
          path: coverage
          retention-days: 7
          if-no-files-found: ignore

  domain-coverage:
    name: Domain coverage ratchet
    needs: [changes, domain-coverage-pass]
    if: github.event_name != 'pull_request' || needs.changes.outputs.domain == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download both passes' blobs and results
        uses: actions/download-artifact@v4
        with:
          pattern: domain-coverage-pass-*
          path: coverage
          merge-multiple: true

      - name: Merge both passes and compare with the committed baseline
        run: node tools/domain-coverage.mjs merge-and-compare

      - name: Compare the baseline with the base branch
        if: github.event_name == 'pull_request' && !cancelled()
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          node tools/domain-coverage.mjs guard-base --base "origin/$BASE_REF"

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-coverage
          path: coverage
          retention-days: 7
          if-no-files-found: ignore

  design-system:
    name: Storybook build + a11y test-runner (packages/ui)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # Browsers and OS packages baked in, so the apt half of `--with-deps` can't stall
    # this required gate on a bad Ubuntu-mirror day. Tag must track `@playwright/test`.
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (for the a11y test-runner)
        run: pnpm exec playwright install chromium

      - name: Build Storybook
        run: pnpm --filter @bombfarm/ui build-storybook

      - name: Run Storybook test-runner (smoke + a11y, every story)
        run: pnpm --filter @bombfarm/ui test-storybook

  ci-web-required:
    name: ci-web-required
    needs: [changes, quality, domain, domain-coverage-pass, domain-coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require path detection
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Require web quality when the filter matched
        if: needs.changes.outputs.web == 'true' && needs.quality.result != 'success'
        run: |
          echo "quality: ${{ needs.quality.result }}"
          exit 1

      # Skipped or cancelled counts as failure here too, for the reason design-system-required
      # spells out below. One failed or cancelled matrix entry makes the whole result non-success.
      - name: Require domain tests when the filter matched
        if: needs.changes.outputs.web == 'true' && needs.domain.result != 'success'
        run: |
          echo "domain: ${{ needs.domain.result }}"
          exit 1

      # Same rule: a coverage ratchet that was skipped or cancelled has not guarded anything. A
      # failed or cancelled pass already skips the ratchet job; this names the pass that did it.
      - name: Require both domain coverage passes when the filter matched
        if: needs.changes.outputs.domain == 'true' && needs.domain-coverage-pass.result != 'success'
        run: |
          echo "domain-coverage-pass: ${{ needs.domain-coverage-pass.result }}"
          exit 1

      # Same rule: a coverage ratchet that was skipped or cancelled has not guarded anything.
      - name: Require the domain coverage ratchet when its filter matched
        if: needs.changes.outputs.domain == 'true' && needs.domain-coverage.result != 'success'
        run: |
          echo "domain-coverage: ${{ needs.domain-coverage.result }}"
          exit 1

  design-system-required:
    name: design-system-required
    needs: [changes, design-system]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require path detection
        if: needs.changes.result != 'success'
        run: exit 1

      # This gate must fail when the path filter matched but the job did not run at all —
      # skipped or cancelled — not just when it actively failed. A gate that reports
      # success for "never ran" is worse than no gate.
      - name: Require design-system suite when the filter matched
        if: needs.changes.outputs.web == 'true' && needs.design-system.result != 'success'
        run: |
          echo "design-system: ${{ needs.design-system.result }}"
          exit 1
