name: CI Web

# Path-filtered web quality including next build (CIV-DEBT-01) before Vercel deploy.

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    # Keep in sync with the dorny/paths-filter list in the changes job below.
    paths:
      - 'apps/web/**'
      - 'packages/domain/**'
      - 'packages/ui/**'
      - 'docs/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - 'vitest.config.ts'
      - '.github/workflows/ci-web.yml'
  pull_request:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Keep in sync with on.push.paths above.
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/domain/**'
              - 'packages/ui/**'
              - 'docs/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - 'vitest.config.ts'
              - '.github/workflows/ci-web.yml'

  quality:
    name: Typecheck, lint, unit, build (web)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web + domain + ui
        run: pnpm --filter @bombfarm/domain --filter @bombfarm/ui --filter @bombfarm/web typecheck

      - name: Lint web + domain + ui
        run: pnpm --filter @bombfarm/domain --filter @bombfarm/ui --filter @bombfarm/web lint

      - name: Unit tests (domain + web)
        run: pnpm --filter @bombfarm/domain test && pnpm --filter @bombfarm/web test

      - name: Build web static export
        run: pnpm --filter @bombfarm/web build

  ci-web-required:
    name: ci-web-required
    needs: [changes, quality]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require path detection
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Require web quality
        if: needs.quality.result == 'failure' || needs.quality.result == 'cancelled'
        run: exit 1
