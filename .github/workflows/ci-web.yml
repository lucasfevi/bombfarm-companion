name: CI Web

# Path-filtered web quality including next build (CIV-DEBT-01) before Vercel deploy.

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    # Keep in sync with the dorny/paths-filter list in the changes job below.
    paths:
      - 'apps/web/**'
      - 'packages/contracts/**'
      - 'packages/domain/**'
      - 'packages/farm/**'
      - 'packages/game-art/**'
      - 'packages/hero/**'
      - 'packages/pricing/**'
      - 'packages/ui/**'
      - 'docs/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - 'vitest.config.ts'
      - '.github/workflows/ci-web.yml'
  pull_request:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Keep in sync with on.push.paths above.
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/contracts/**'
              - 'packages/domain/**'
              - 'packages/farm/**'
              - 'packages/game-art/**'
              - 'packages/hero/**'
              - 'packages/pricing/**'
              - 'packages/ui/**'
              - 'docs/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - 'vitest.config.ts'
              - '.github/workflows/ci-web.yml'

  quality:
    name: Typecheck, lint, build, unit (web)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # packages/domain resolves @bombfarm/contracts through node_modules -> dist/index.d.ts,
      # not a tsconfig `paths` mapping to source (that fails TS6059: domain's tsconfig sets
      # rootDir: "src", and a paths entry pointing outside it is rejected). So contracts must
      # be built before anything that typechecks domain source, same as ci-desktop.yml's
      # existing "Build workspace packages (desktop deps)" step.
      # `@bombfarm/pricing` is the one workspace package the planner consumes from `dist` rather
      # than from source: it carries `.js` import specifiers so its build stays importable by the
      # Node-side snapshot tool, which rules out the source alias the other packages use.
      - name: Build contracts and pricing (type dependencies)
        run: pnpm --filter @bombfarm/contracts --filter @bombfarm/pricing build

      # apps/web itself still resolves @bombfarm/domain SOURCE via tsconfig `paths` and the
      # Vitest `resolve.alias` — this step is NOT that. It exists so
      # packages/domain's own packaging test (dist-package-exports.test.ts) has a
      # dist/ to assert against when "Unit tests (domain)" below runs, and because
      # @bombfarm/farm and @bombfarm/hero reach domain through its exports map (which points
      # at dist), so the typecheck and lint steps below cannot run before this. Do not
      # "simplify" this into a web dependency; web never reads packages/domain/dist.
      - name: Build domain (its own packaging test needs dist)
        run: pnpm --filter @bombfarm/domain build

      - name: Typecheck web + domain + ui + farm + hero
        run: >
          pnpm --filter @bombfarm/domain --filter @bombfarm/ui --filter @bombfarm/farm
          --filter @bombfarm/hero --filter @bombfarm/web typecheck

      - name: Lint web + domain + ui + farm + hero
        run: >
          pnpm --filter @bombfarm/domain --filter @bombfarm/ui --filter @bombfarm/farm
          --filter @bombfarm/hero --filter @bombfarm/web lint

      # Domain tests need no build output, so they stay ahead of the (slow) build to keep
      # fast feedback on the most common failures.
      - name: Unit tests (domain)
        run: pnpm --filter @bombfarm/domain test

      # MUST stay before the web unit tests. Several web tests assert on real build output
      # in apps/web/out (team-plan-worker-bundle, devtools-not-in-production-bundle) — the
      # only byte-level proof that a chunk actually shipped. This step used to run AFTER
      # them, so out/ never existed and those assertions silently skipped on every CI run.
      # See apps/web/src/tests/support/build-output.ts; they now fail loudly instead.
      - name: Build web static export
        run: pnpm --filter @bombfarm/web build

      - name: Unit tests (web, asserts against the build above)
        run: pnpm --filter @bombfarm/web test

  design-system:
    name: Storybook build + a11y test-runner (packages/ui)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # Browsers and OS packages baked in, so the apt half of `--with-deps` can't stall
    # this required gate on a bad Ubuntu-mirror day. Tag must track `@playwright/test`.
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (for the a11y test-runner)
        run: pnpm exec playwright install chromium

      - name: Build Storybook
        run: pnpm --filter @bombfarm/ui build-storybook

      - name: Run Storybook test-runner (smoke + a11y, every story)
        run: pnpm --filter @bombfarm/ui test-storybook

  ci-web-required:
    name: ci-web-required
    needs: [changes, quality]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require path detection
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Require web quality
        if: needs.quality.result == 'failure' || needs.quality.result == 'cancelled'
        run: exit 1

  design-system-required:
    name: design-system-required
    needs: [changes, design-system]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require path detection
        if: needs.changes.result != 'success'
        run: exit 1

      # Deliberately NOT the ci-web-required idiom above (which only checks
      # failure/cancelled and treats skipped as pass unconditionally): this gate
      # must fail when the path filter matched but the job did not run at all —
      # skipped or cancelled — not just when it actively failed. A gate that
      # reports success for "never ran" is worse than no gate (SBC-19/AD-018).
      - name: Require design-system suite when the filter matched
        if: needs.changes.outputs.web == 'true' && needs.design-system.result != 'success'
        run: |
          echo "design-system: ${{ needs.design-system.result }}"
          exit 1
