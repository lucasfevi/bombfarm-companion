<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Bomb Farm Companion">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1814"/>
      <stop offset="55%" stop-color="#221e18"/>
      <stop offset="100%" stop-color="#2a2218"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#b96b17" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#b96b17" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#b96b17" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ebe6dc" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="980" cy="120" rx="420" ry="280" fill="url(#glow)"/>
  <rect x="0" y="0" width="14" height="630" fill="#b96b17"/>

  <g font-family="Segoe UI, system-ui, Arial, sans-serif">
    <text x="88" y="248" fill="#ebe6dc" font-size="72" font-weight="700" letter-spacing="-1.2">Bomb Farm Companion</text>
    <text x="88" y="328" fill="#c4b8a4" font-size="34" font-weight="500">Plan gear, skill points and DPS in the browser</text>
    <text x="88" y="546" fill="#8f8778" font-size="22" font-weight="500">Unofficial fan tool - Not affiliated with Bomb Farm</text>
  </g>

  <g transform="translate(1040 470)">
    <circle cx="40" cy="40" r="40" fill="#b96b17"/>
    <circle cx="40" cy="44" r="18" fill="#1a1814"/>
    <rect x="34" y="14" width="12" height="14" rx="3" fill="#ebe6dc"/>
  </g>
</svg>
